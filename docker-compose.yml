  version: '3.8'

  services:
    postgres:
      image: postgres:15-alpine
      container_name: iceberg_metastore
      environment:
        POSTGRES_USER: iceberg
        POSTGRES_PASSWORD: iceberg
        POSTGRES_DB: iceberg_metastore
      ports:
        - "5432:5432"
      volumes: 
        - ./workspace/pg_data:/var/lib/postgresql/data

    minio:
      image: minio/minio:latest
      container_name: minio_storage
      environment:
        MINIO_ROOT_USER: admin
        MINIO_ROOT_PASSWORD: password
      command: server /data --console-address ":9001"
      ports:
        - "9000:9000" # API
        - "9001:9001" # UI
      volumes: 
        - ./workspace/minio_data:/data

    minio-init:
      image: minio/mc:latest
      container_name: minio_init
      depends_on:
        - minio
      entrypoint: >
        /bin/sh -c "
        sleep 5;
        mc alias set myminio http://minio:9000 admin password;
        mc mb myminio/warehouse;
        exit 0;
        "

    kafka:
      image: apache/kafka:latest
      container_name: kafka_broker
      ports:
      - "9092:9092"
      environment:
        CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
        KAFKA_NODE_ID: 1
        KAFKA_PROCESS_ROLES: broker,controller
        KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    spark-jupyter:
      build: 
        context: .
        dockerfile: Dockerfile
      container_name: spark_workspace
      environment:
        - JUPYTER_ENABLE_LAB=yes
        - GRANT_SUDO=yes
      user: root # for pip install
      ports:
        - "8888:8888" # jupyter UI
        - "4040:4040" # spark UI
      volumes:
        - ./workspace:/home/jovyan/work # for scripts
      depends_on:
        - postgres
        - minio
        - kafka

    airflow-init:
      image: apache/airflow:2.8.1
      container_name: airflow_init
      depends_on:
        - postgres
      environment:
        - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://iceberg:iceberg@postgres/iceberg_metastore
        - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      command: >
        bash -c "
        airflow db migrate &&
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com
        "

    airflow-webserver:
      image: apache/airflow:2.8.1
      container_name: airflow_webserver
      restart: always
      depends_on:
        airflow-init:
          condition: service_completed_successfully
        postgres:
          condition: service_started
      ports:
        - "8080:8080" 
      environment:
        - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://iceberg:iceberg@postgres/iceberg_metastore
        - AIRFLOW__CORE__EXECUTOR=LocalExecutor
        - AIRFLOW__CORE__LOAD_EXAMPLES=False 
      volumes:
        - ./workspace/dags:/opt/airflow/dags 
      command: webserver

    airflow-scheduler:
      image: apache/airflow:2.8.1
      container_name: airflow_scheduler
      restart: always
      depends_on:
        airflow-init:
          condition: service_completed_successfully
        postgres:
          condition: service_started
      environment:
        - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://iceberg:iceberg@postgres/iceberg_metastore
        - AIRFLOW__CORE__EXECUTOR=LocalExecutor
        - AIRFLOW__CORE__LOAD_EXAMPLES=False
      volumes:
        - ./workspace/dags:/opt/airflow/dags
      command: scheduler